# Server Configuration
server.port=8080

# Application Details
spring.application.name=CyberShield

# Primary PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cybershield_db
spring.datasource.username=postgres
spring.datasource.password=Hari@2008
spring.datasource.driver-class-name=org.postgresql.Driver

# Fallback MySQL Database Configuration
spring.datasource.mysql.url=jdbc:mysql://localhost:3306/cybershield_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=2000&socketTimeout=2000
spring.datasource.mysql.username=root
spring.datasource.mysql.password=root

# HikariCP Connection Pool Settings (graceful initialization if DB starts later)
spring.datasource.hikari.initialization-fail-timeout=-1

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static Resources & Thymeleaf Cache Settings (Instant Reloading)
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
